[project]
authors         = [{ name = "Kevin Montoya", email = "me@kmontocam.com" }]
dependencies    = []
description     = "Schema on read based logging"
name            = "lumberjack"
readme          = "README.md"
requires-python = ">=3.12"
version         = "0.1.0"

[build-system]
build-backend = "uv_build"
requires      = ["uv_build>=0.11.14,<0.12.0"]

[dependency-groups]
dev = [
  "mbake==1.4.6",
  "pre-commit==4.6.0",
  "pyyaml==6.0.3",
  "ruff==0.15.14",
  "taplo==0.9.3",
  "ty==0.0.38",
]

[tool.ruff]
line-length    = 88
target-version = "py312"

  [tool.ruff.lint]
  ignore = ["COM812", "D203", "D212"]
  select = ["ALL"]

  [tool.ruff.format]
  docstring-code-format = true
  quote-style           = "double"
